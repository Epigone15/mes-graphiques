<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphiques Pro - Custom & Export</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 30px;
            background: #eef1f5;
            color: #333;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
        }

        select, input, button {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            font-size: 15px;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .chart-container {
            padding: 20px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid #ddd;
        }

        .data-editor {
            margin-top: 30px;
            padding: 20px;
            background: #fafafa;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-family: monospace;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Graphiques Pro – Customisation & Export</h1>

    <!-- CONTROLS -->
    <div class="controls">
        <select id="chartType">
            <option value="pie">Camembert</option>
            <option value="bar">Histogramme</option>
            <option value="line">Courbe</option>
            <option value="area">Aire</option>
            <option value="radialBar">Radial</option>
            <option value="donut">Donut</option>
        </select>

        <select id="colorTheme">
            <option value="default">Thème par défaut</option>
            <option value="monochrome">Monochrome</option>
            <option value="pastel">Pastel</option>
            <option value="dark">Sombre</option>
        </select>

        <button id="exportPNG">PNG</button>
        <button id="exportSVG">SVG</button>
        <button id="exportCSV">CSV</button>
    </div>

    <!-- CHART -->
    <div class="chart-container">
        <div id="chart"></div>
    </div>

    <!-- DATA EDITOR -->
    <div class="data-editor">
        <h3>Modifier les données</h3>
        <p>Format : {"labels":["A","B"],"series":[10,20]}</p>
        <textarea id="dataInput">{ "labels": ["Apple", "Mango", "Orange", "Banane"], "series": [44, 55, 13, 33] }</textarea>
        <button id="updateData">Mettre à jour</button>
    </div>

</div>

<script>
    // THEMES
    const colorThemes = {
        default: ['#008FFB', '#00E396', '#FEB019', '#FF4560'],
        monochrome: ['#444', '#666', '#888', '#aaa'],
        pastel: ['#FF9AA2', '#FFB7B2', '#FFDAC1', '#E2F0CB'],
        dark: ['#2E93fA', '#66DA26', '#546E7A', '#FF6B6B'],
    };

    // DEFAULT DATA
    let chartData = {
        labels: ["Apple", "Mango", "Orange", "Banane"],
        series: [44, 55, 13, 33]
    };

    // CHART INIT
    let chartOptions = {
        chart: {
            type: 'pie',
            height: 420,
            toolbar: { show: true },
            animations: { enabled: true }
        },
        labels: chartData.labels,
        series: chartData.series,
        colors: colorThemes.default,
        legend: { position: 'bottom' }
    };

    let chart = new ApexCharts(document.querySelector("#chart"), chartOptions);
    chart.render();

    // TYPE CHANGE
    document.getElementById("chartType").addEventListener("change", e => {
        chart.updateOptions({ chart: { type: e.target.value } });
    });

    // THEME CHANGE
    document.getElementById("colorTheme").addEventListener("change", e => {
        chart.updateOptions({ colors: colorThemes[e.target.value] });
    });

    // UPDATE DATA
    document.getElementById("updateData").addEventListener("click", () => {
        try {
            const newData = JSON.parse(document.getElementById("dataInput").value);
            chartData = newData;

            chart.updateOptions({
                labels: newData.labels,
                series: newData.series
            });

        } catch (err) {
            alert("Format JSON invalide !");
        }
    });

    // EXPORT PNG
    document.getElementById("exportPNG").addEventListener("click", () => {
        chart.dataURI().then(uri => {
            let a = document.createElement("a");
            a.href = uri.imgURI;
            a.download = "graphique.png";
            a.click();
        });
    });

    // EXPORT SVG
    document.getElementById("exportSVG").addEventListener("click", () => {
        chart.dataURI().then(uri => {
            let a = document.createElement("a");
            a.href = uri.svgURI;
            a.download = "graphique.svg";
            a.click();
        });
    });

    // EXPORT CSV
    document.getElementById("exportCSV").addEventListener("click", () => {
        let csv = "Label,Valeur\n";
        chartData.labels.forEach((label, i) => {
            csv += `${label},${chartData.series[i]}\n`;
        });

        let blob = new Blob([csv], { type: "text/csv" });
        let url = URL.createObjectURL(blob);

        let a = document.createElement("a");
        a.href = url;
        a.download = "graphique.csv";
        a.click();
    });
</script>

</body>
</html>
